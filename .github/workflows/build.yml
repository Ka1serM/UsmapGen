name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install the toolchain
        run: dnf install -y --setopt=install_weak_deps=False git clang llvm lld compiler-rt libcxx-devel libcxx-static libcxxabi-devel libcxxabi-static llvm-libunwind-devel llvm-libunwind-static cmake ninja-build python3 libicu zstd tar

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release

      - uses: actions/upload-artifact@v7
        with:
          path: build-linux-release/tools/usmapgen
          archive: false
          # The release keeps the binaries of main, so the artifacts only need to last until the release job.
          retention-days: 1

      - name: Restore the dedicated servers
        id: executables
        uses: actions/cache/restore@v4
        with:
          path: tests/Executables
          key: executables-${{ hashFiles('tests/Executables.json', 'tests/fetch.py') }}

      - name: Test
        id: test
        run: ctest --preset linux-release

      - name: Report
        if: always() && steps.test.outcome != 'skipped'
        run: |
          failed=build-linux-release/Testing/Temporary/LastTestsFailed.log
          if [ "${{ steps.test.outcome }}" = success ]; then
            echo "All tests passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Failed tests"
            echo
            sed 's/^[0-9]*:/- /' "$failed" 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the dedicated servers
        if: always() && steps.executables.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: tests/Executables
          key: ${{ steps.executables.outputs.cache-primary-key }}

  windows:
    name: Windows
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the toolchain
        run: |
          sudo apt-get install -y ninja-build
          curl -fsSL -o "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release

      - uses: actions/upload-artifact@v7
        with:
          path: build-windows-release/tools/usmapgen.exe
          archive: false
          retention-days: 1

  # Each push to main whose tests pass publishes the release of the version in project() of CMakeLists.txt, and
  # moves its tag to the commit of the push.
  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The artifacts lose the executable bit.
      - name: Pack the release files
        run: |
          version=$(sed -nE 's/^project\(UsmapGen VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir release
          cp dist/usmapgen.exe release/usmapgen.exe
          install -m 755 dist/usmapgen release/usmapgen

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # An existing release stays: its tag moves to this commit, and each file replaces the one of the same name.
        run: |
          tag="v$VERSION"
          notes="Built from $GITHUB_SHA."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "UsmapGen $VERSION" --notes "$notes"
          fi
